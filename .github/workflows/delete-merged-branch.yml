name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-head:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch after merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "${BRANCH}" in
            main|dev|test)
              echo "Skip protected branch: ${BRANCH}"
              exit 0
              ;;
          esac
          echo "Deleting heads/${BRANCH} from ${REPO}"
          # 204 = deleted; 422/404 = already gone
          code=$(curl -sS -o /tmp/del.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}")
          echo "HTTP ${code}"
          if [[ "${code}" == "204" || "${code}" == "404" || "${code}" == "422" ]]; then
            echo "OK"
            exit 0
          fi
          cat /tmp/del.json || true
          exit 1
