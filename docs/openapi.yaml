openapi: 3.0.3
info:
  title: Graphics Pipeline World Builder API
  version: 0.6.0
  description: |
    S3-B #74 stub — hand-written coverage of existing Express routes.
    Not a full codegen client. No secrets.
    S3-D (R1 rev2 §0): every 4xx/5xx JSON body is `Error` — flat `{ code, error, ...extra }`.
    Bodies never carry absolute filesystem paths (repo-relative `rel` only).
    MAX_GLB_MB (env, default 100, integer >= 1; invalid -> server refuses to start).
    S3-D 0.5.0: every error code, HTTP status and CLI exit is listed in docs/error-codes.md
    (#152; kept in sync both ways by tests/s3d-error-codes.test.mjs).
    S3-E 0.6.0: POST/PATCH/DELETE under /api are rate-limited per client IP (RATE_LIMIT_PER_MIN,
    default 60) -> 429 RATE_LIMITED {retryAfterSec} + Retry-After header; GET/HEAD/OPTIONS never.
    CORS is an exact-origin allowlist (CORS_ORIGINS, default http://localhost:5173 and
    http://127.0.0.1:5173; never "*"); a disallowed preflight -> 403 CORS_ORIGIN_DENIED.
    Invalid RATE_LIMIT_PER_MIN / CORS_ORIGINS / TRUST_PROXY / MAX_GLB_MB -> CONFIG_INVALID, no start.
servers:
  - url: http://127.0.0.1:8787
    description: Local world-builder
paths:
  /api/health:
    get:
      summary: Health + tool versions (+ bridge mock)
      responses:
        "200":
          description: OK
        "503":
          description: Strict Krita down
  /api/assets:
    get:
      summary: List/search assets
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: stage
          schema: { type: string, enum: [mvp-billboard, rigged, scene] }
        - in: query
          name: characterType
          schema: { type: string }
        - in: query
          name: clip
          schema: { type: string }
          description: Repeatable; AND across values
        - in: query
          name: tag
          schema: { type: string }
          description: Repeatable; AND across values
        - in: query
          name: sort
          schema: { type: string, enum: ["-createdAt", createdAt] }
          description: S3-D #94 - order by createdAt; assets without createdAt (legacy) always last
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: S3-D #94 - cap after filter/sort; outside 1..100 -> 400 VALIDATION
      responses:
        "200":
          description: Asset array
        "400":
          description: VALIDATION - unknown stage, bad sort or limit outside 1..100
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Register / upsert asset (schema + scene V4 gates)
      description: |
        S3-D #141 - formats.{glb,fbx,obj,preview} must resolve (realpath) under DATA_ROOT and
        formats.sourcePng under data/inbox; `..`, absolute, %2e%2e, NUL or symlink escape -> 400
        PATH_OUTSIDE_INBOX (input/resolved path not echoed). #76 - formats.glb larger than
        MAX_GLB_MB -> 413 GLB_TOO_LARGE {sizeBytes, maxBytes}, checked before schema/probe.
        #49/#97 - importMeta.warnings[] {code, message?, detail?, clip?} is warn-only
        (PNG_ALPHA_PREMULT_SUSPECT, IDLE_TPOSE_SUSPECT); a humanoid whose only idle carries
        IDLE_TPOSE_SUSPECT fails the humanoid clips gate (400 VALIDATION).
        S3-D #127 - a slug already owned by a different id -> 409 SLUG_CLASH {slug, existingId,
        suggestedSlug} (first free `<slug>-2`, `-3`, ...); same id + same slug stays an idempotent upsert.
        #88 - optional altText (trimmed, 1-280; "" omitted) -> >280 is 400 ALT_TEXT_TOO_LONG.
        #94 - createdAt/updatedAt default to now (ISO) when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Created/upserted
        "400":
          description: VALIDATION / MULTI_ARMATURE / SCENE_CAMERAS_MAX / SCENE_RESOLVE / PATH_OUTSIDE_INBOX / ALT_TEXT_TOO_LONG
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: SLUG_CLASH
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugClash" }
        "413":
          description: GLB_TOO_LARGE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlbTooLarge" }
  /api/assets/{id}:
    get:
      summary: Get asset by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset
        "404":
          description: Not found
    patch:
      summary: Patch metadata (name/tags/clipTags/clipUx/scene/importMeta/license/altText)
      description: |
        Forbidden - formats, clips, rig, stage, id, slug, clipDurations.
        importMeta is merged. assetSchemaVersion cannot decrement.
        S3-C - scene.view {ground?, shadows?} and scene.cameras (max 16; finite
        position/target; name 1-40; fov 10-120) validated; 17th camera or NaN -> 400.
        S3-D #88 - altText is trimmed; "" or null clears it; more than 280 characters ->
        400 ALT_TEXT_TOO_LONG {length, max}; a non-string -> 400 VALIDATION.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated
        "400":
          description: VALIDATION / PATCH_FORBIDDEN_FIELD / SCHEMA_VERSION_DECREMENT / ALT_TEXT_TOO_LONG
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
    delete:
      summary: Delete asset metadata (S3-C tip3; data files untouched)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: ASSET_IN_USE {refs} - still referenced by a scene
  /api/assets/{id}/clip-ux:
    patch:
      summary: Patch clipUx only
      description: |
        S3-C #1/#2 - blendMs (0-1000, default 250 in viewer) and timeScale
        (0.5-2.0, default 1.0). Out of range / non-finite -> 400. Never alters
        clipDurations (probe SoT).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultClip: { type: string }
                order: { type: array, items: { type: string } }
                disabled: { type: array, items: { type: string } }
                blendMs: { type: number, minimum: 0, maximum: 1000 }
                timeScale: { type: number, minimum: 0.5, maximum: 2 }
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated
        "400":
          description: Invalid blendMs / timeScale / clipDurations write
        "404":
          description: Not found
  /api/assets/{id}/file:
    get:
      summary: Download GLB/FBX/OBJ
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string, enum: [glb, fbx, obj] }
      responses:
        "200":
          description: File bytes
        "400":
          description: PATH_OUTSIDE_INBOX (stored path escapes DATA_ROOT)
        "404":
          description: NOT_FOUND / FILE_MISSING {rel} (no absolute path)
  /api/assets/{id}/preview:
    get:
      summary: Preview PNG
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG
        "400":
          description: PATH_OUTSIDE_INBOX (stored path escapes DATA_ROOT)
        "404":
          description: FILE_MISSING {rel} (no absolute path)
  /api/openapi.json:
    get:
      summary: This OpenAPI document as JSON (parsed from docs/openapi.yaml)
      responses:
        "200":
          description: OpenAPI JSON
          content:
            application/json: {}
  /api/openapi.yaml:
    get:
      summary: This OpenAPI document as raw YAML (docs/openapi.yaml)
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml: {}
components:
  responses:
    RateLimited:
      description: RATE_LIMITED (S3-E #139) — per-IP token bucket empty; wait Retry-After seconds
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RateLimited" }
  schemas:
    RateLimited:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [retryAfterSec]
          properties:
            retryAfterSec: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [code, error]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$" }
        error: { type: string, description: Human text (back-compat string) }
      additionalProperties: true
    GlbTooLarge:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            sizeBytes: { type: integer }
            maxBytes: { type: integer }
    SlugClash:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [slug, existingId, suggestedSlug]
          properties:
            slug: { type: string }
            existingId: { type: string }
            suggestedSlug: { type: string }
