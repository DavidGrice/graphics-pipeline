openapi: 3.0.3
info:
  title: Graphics Pipeline World Builder API
  version: 0.3.0
  description: |
    S3-B #74 stub — hand-written coverage of existing Express routes.
    Not a full codegen client. No secrets.
servers:
  - url: http://127.0.0.1:8787
    description: Local world-builder
paths:
  /api/health:
    get:
      summary: Health + tool versions (+ bridge mock)
      responses:
        "200":
          description: OK
        "503":
          description: Strict Krita down
  /api/assets:
    get:
      summary: List/search assets
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: stage
          schema: { type: string, enum: [mvp-billboard, rigged, scene] }
        - in: query
          name: characterType
          schema: { type: string }
        - in: query
          name: clip
          schema: { type: string }
          description: Repeatable; AND across values
        - in: query
          name: tag
          schema: { type: string }
          description: Repeatable; AND across values
      responses:
        "200":
          description: Asset array
        "400":
          description: Unknown stage
    post:
      summary: Register / upsert asset (schema + scene V4 gates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created/upserted
        "400":
          description: Validation failed
  /api/assets/{id}:
    get:
      summary: Get asset by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset
        "404":
          description: Not found
    patch:
      summary: Patch metadata (name/tags/clipTags/clipUx/scene/importMeta/license)
      description: |
        Forbidden - formats, clips, rig, stage, id, slug, clipDurations.
        importMeta is merged. assetSchemaVersion cannot decrement.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "400":
          description: Validation / forbidden field
        "404":
          description: Not found
  /api/assets/{id}/clip-ux:
    patch:
      summary: Patch clipUx only
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
  /api/assets/{id}/file:
    get:
      summary: Download GLB/FBX/OBJ
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string, enum: [glb, fbx, obj] }
      responses:
        "200":
          description: File bytes
        "404":
          description: Missing
  /api/assets/{id}/preview:
    get:
      summary: Preview PNG
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG
        "404":
          description: Missing
  /api/openapi.json:
    get:
      summary: This OpenAPI document as JSON (parsed from docs/openapi.yaml)
      responses:
        "200":
          description: OpenAPI JSON
          content:
            application/json: {}
  /api/openapi.yaml:
    get:
      summary: This OpenAPI document as raw YAML (docs/openapi.yaml)
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml: {}
