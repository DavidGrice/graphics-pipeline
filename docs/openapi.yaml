openapi: 3.0.3
info:
  title: Graphics Pipeline World Builder API
  version: 0.4.0
  description: |
    S3-B #74 stub — hand-written coverage of existing Express routes.
    Not a full codegen client. No secrets.
    S3-D (R1 rev2 §0): every 4xx/5xx JSON body is `Error` — flat `{ code, error, ...extra }`.
    Bodies never carry absolute filesystem paths (repo-relative `rel` only).
    MAX_GLB_MB (env, default 100, integer >= 1; invalid -> server refuses to start).
servers:
  - url: http://127.0.0.1:8787
    description: Local world-builder
paths:
  /api/health:
    get:
      summary: Health + tool versions (+ bridge mock)
      responses:
        "200":
          description: OK
        "503":
          description: Strict Krita down
  /api/assets:
    get:
      summary: List/search assets
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: stage
          schema: { type: string, enum: [mvp-billboard, rigged, scene] }
        - in: query
          name: characterType
          schema: { type: string }
        - in: query
          name: clip
          schema: { type: string }
          description: Repeatable; AND across values
        - in: query
          name: tag
          schema: { type: string }
          description: Repeatable; AND across values
      responses:
        "200":
          description: Asset array
        "400":
          description: Unknown stage
    post:
      summary: Register / upsert asset (schema + scene V4 gates)
      description: |
        S3-D #141 - formats.{glb,fbx,obj,preview} must resolve (realpath) under DATA_ROOT and
        formats.sourcePng under data/inbox; `..`, absolute, %2e%2e, NUL or symlink escape -> 400
        PATH_OUTSIDE_INBOX (input/resolved path not echoed). #76 - formats.glb larger than
        MAX_GLB_MB -> 413 GLB_TOO_LARGE {sizeBytes, maxBytes}, checked before schema/probe.
        #49/#97 - importMeta.warnings[] {code, message?, detail?, clip?} is warn-only
        (PNG_ALPHA_PREMULT_SUSPECT, IDLE_TPOSE_SUSPECT); a humanoid whose only idle carries
        IDLE_TPOSE_SUSPECT fails the humanoid clips gate (400 VALIDATION).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created/upserted
        "400":
          description: VALIDATION / MULTI_ARMATURE / SCENE_CAMERAS_MAX / SCENE_RESOLVE / PATH_OUTSIDE_INBOX
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: GLB_TOO_LARGE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlbTooLarge" }
  /api/assets/{id}:
    get:
      summary: Get asset by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset
        "404":
          description: Not found
    patch:
      summary: Patch metadata (name/tags/clipTags/clipUx/scene/importMeta/license)
      description: |
        Forbidden - formats, clips, rig, stage, id, slug, clipDurations.
        importMeta is merged. assetSchemaVersion cannot decrement.
        S3-C - scene.view {ground?, shadows?} and scene.cameras (max 16; finite
        position/target; name 1-40; fov 10-120) validated; 17th camera or NaN -> 400.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "400":
          description: Validation / forbidden field
        "404":
          description: Not found
    delete:
      summary: Delete asset metadata (S3-C tip3; data files untouched)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: ASSET_IN_USE {refs} - still referenced by a scene
  /api/assets/{id}/clip-ux:
    patch:
      summary: Patch clipUx only
      description: |
        S3-C #1/#2 - blendMs (0-1000, default 250 in viewer) and timeScale
        (0.5-2.0, default 1.0). Out of range / non-finite -> 400. Never alters
        clipDurations (probe SoT).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultClip: { type: string }
                order: { type: array, items: { type: string } }
                disabled: { type: array, items: { type: string } }
                blendMs: { type: number, minimum: 0, maximum: 1000 }
                timeScale: { type: number, minimum: 0.5, maximum: 2 }
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid blendMs / timeScale / clipDurations write
        "404":
          description: Not found
  /api/assets/{id}/file:
    get:
      summary: Download GLB/FBX/OBJ
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string, enum: [glb, fbx, obj] }
      responses:
        "200":
          description: File bytes
        "400":
          description: PATH_OUTSIDE_INBOX (stored path escapes DATA_ROOT)
        "404":
          description: NOT_FOUND / FILE_MISSING {rel} (no absolute path)
  /api/assets/{id}/preview:
    get:
      summary: Preview PNG
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG
        "400":
          description: PATH_OUTSIDE_INBOX (stored path escapes DATA_ROOT)
        "404":
          description: FILE_MISSING {rel} (no absolute path)
  /api/openapi.json:
    get:
      summary: This OpenAPI document as JSON (parsed from docs/openapi.yaml)
      responses:
        "200":
          description: OpenAPI JSON
          content:
            application/json: {}
  /api/openapi.yaml:
    get:
      summary: This OpenAPI document as raw YAML (docs/openapi.yaml)
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml: {}
components:
  schemas:
    Error:
      type: object
      required: [code, error]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$" }
        error: { type: string, description: Human text (back-compat string) }
      additionalProperties: true
    GlbTooLarge:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            sizeBytes: { type: integer }
            maxBytes: { type: integer }
